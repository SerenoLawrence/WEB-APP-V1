name: civilwatch
description: "CIVILWATCH: A Geotagged Community Infrastructure and Environmental Incident Reporting, Management, and Monitoring System for Digos City."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets folders are intentionally empty for now.
  # Images are loaded via network URLs (see lib/core/constants/app_images.dart).
  # Uncomment and add files here when real assets are available:
  # assets:
  #   - assets/images/
  #   - assets/logos/
  #   - assets/icons/
  #   - assets/animations/
  #   - assets/maps/
